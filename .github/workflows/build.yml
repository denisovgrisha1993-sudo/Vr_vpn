name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sed -i '10i\        ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

      - name: Clean up and Inject Custom Russian Routing
        run: |
          # 1. Включаем Пользовательские правила (Custom) по умолчанию
          CONFIG_FILE=$(find . -name "AngConfigManager.kt" -o -name "MmkvManager.kt" | head -n 1)
          if [ -n "$CONFIG_FILE" ]; then
            sed -i 's/ROUTING_MODE, "0"/ROUTING_MODE, "3"/g' $CONFIG_FILE
            sed -i 's/ROUTING_MODE, "2"/ROUTING_MODE, "3"/g' $CONFIG_FILE
          fi

          # 2. Твой список доменов (включая .ru, .su и .рф (xn--p1ai))
          RU_DOMAINS="domain:ru,domain:su,domain:xn--p1ai,geosite:yandex,geosite:vk,domain:ozon.ru,domain:wildberries.ru,domain:wb.ru,domain:avito.ru,domain:sberbank.ru,domain:tinkoff.ru,domain:tbank.ru,domain:gosuslugi.ru"
          
          # 3. Находим все файлы кода и переводим иероглифы на русский + вставляем домены
          find . -type f -name "*.kt" -o -name "*.json" -o -name "*.xml" | while read file; do
            # Перевод системных правил
            sed -i 's/阻断udp443/Блокировка QUIC (udp443)/g' "$file"
            sed -i 's/代理Google/Прокси Google/g' "$file"
            sed -i 's/绕过局域网IP/Локальные IP (Direct)/g' "$file"
            sed -i 's/绕过局域网域名/Локальные домены (Direct)/g' "$file"
            sed -i 's/绕过中国公共DNSIP/Публичные DNS IP (Direct)/g' "$file"
            sed -i 's/绕过中国公共DNS域名/Публичные DNS домены (Direct)/g' "$file"
            
            # Превращаем китайский обход в обход РФ
            sed -i 's/绕过中国IP/RU IP/g' "$file"
            sed -i 's/绕过中国域名/RU/g' "$file"

            # Вставляем твои списки вместо китайских (cn -> ru)
            sed -i 's/geoip:cn/geoip:ru/g' "$file"
            sed -i "s/geosite:cn/$RU_DOMAINS/g" "$file"
          done

      - name: Build libhevtun
        run: |
          bash compile-hevtun.sh

      - name: Copy libhevtun
        run: |
          cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: 'V2rayNG/app/libs/'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-vpn-apk
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/*.apk
