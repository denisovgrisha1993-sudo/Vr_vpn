name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sed -i '10i\        ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

      - name: Hardcode Custom Routing Rules
        run: |
          # 1. Принудительно включаем "Пользовательские правила" (режим 3) по умолчанию
          find . -type f -name "MmkvManager.kt" -exec sed -i 's/ROUTING_MODE, "0"/ROUTING_MODE, "3"/g' {} +
          find . -type f -name "MmkvManager.kt" -exec sed -i 's/ROUTING_MODE, "2"/ROUTING_MODE, "3"/g' {} +

          # 2. Твой идеальный список доменов из JSON (строго сохраняя синтаксис кавычек)
          RU_DOMAINS='"domain:ru","geosite:yandex","geosite:vk","domain:ozon.ru","domain:wildberries.ru","domain:wb.ru","domain:avito.ru","domain:sberbank.ru","domain:tinkoff.ru","domain:tbank.ru","domain:gosuslugi.ru"'
          
          # 3. Массовая и агрессивная подмена во всех файлах проекта (Kotlin, JSON, XML)
          find . -type f \( -name "*.kt" -o -name "*.json" -o -name "*.xml" \) -exec sh -c '
            # Заменяем китайские домены и IP на российские
            sed -i "s/\"geosite:cn\"/$RU_DOMAINS/g" "$1"
            sed -i "s/\"geoip:cn\"/\"geoip:ru\"/g" "$1"
            
            # Переводим названия (remarks) на чистый русский, как в твоем JSON
            sed -i "s/绕过中国域名/RU/g" "$1"
            sed -i "s/绕过中国IP/RU IP/g" "$1"
            sed -i "s/阻断udp443/Блокировка QUIC/g" "$1"
            sed -i "s/代理Google/Прокси Google/g" "$1"
            sed -i "s/绕过局域网IP/Локальные IP/g" "$1"
            sed -i "s/绕过局域网域名/Локальные домены/g" "$1"
            sed -i "s/绕过中国公共DNSIP/Публичные DNS IP/g" "$1"
            sed -i "s/绕过中国公共DNS域名/Публичные DNS домены/g" "$1"
          ' sh {} \;

      - name: Build libhevtun
        run: |
          bash compile-hevtun.sh

      - name: Copy libhevtun
        run: |
          cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: 'V2rayNG/app/libs/'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-vpn-apk
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/*.apk
